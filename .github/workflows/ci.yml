name: MCG gates

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  tofu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/cloud/tofu/.opentofu-version
          tofu_wrapper: false
      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/cloud/tofu
      - name: Initialize providers without a cloud backend
        working-directory: infra/cloud/tofu
        run: tofu init -backend=false -input=false
      - name: Validate OpenTofu configuration
        working-directory: infra/cloud/tofu
        run: tofu validate

  mcg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Enforce workspace package boundaries
        run: pnpm check:architecture
      - name: Workspace package unit tests
        run: pnpm -r --if-present test:unit
      - name: Engineering delivery and Git hygiene regression tests
        run: pnpm test:engineering-gates
      - name: Enforce Git naming contract
        env:
          NEXUS_BRANCH: ${{ github.head_ref || github.ref_name }}
          NEXUS_EVENT_NAME: ${{ github.event_name }}
          NEXUS_IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          NEXUS_PR_TITLE: ${{ github.event.pull_request.title }}
          NEXUS_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          NEXUS_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          NEXUS_REPOSITORY: ${{ github.repository }}
          NEXUS_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pnpm test:git-naming
          if [[ "$NEXUS_IS_PULL_REQUEST" == 'true' ]]; then
            node tooling/scripts/check-git-naming.mjs \
              --pr-title "$NEXUS_PR_TITLE" \
              --branch "$NEXUS_BRANCH" \
              --pr-author "$NEXUS_PR_AUTHOR" \
              --pr-head-repo "$NEXUS_PR_HEAD_REPO" \
              --repository "$NEXUS_REPOSITORY"
          elif [[ "$NEXUS_EVENT_NAME" == 'push' && "$NEXUS_BRANCH" == dependabot/* ]]; then
            echo "Dependabot branches are validated in pull_request context."
          elif [[ "$NEXUS_EVENT_NAME" == 'push' && "$NEXUS_BRANCH" == 'main' ]]; then
            commit_subject="${NEXUS_HEAD_COMMIT_MESSAGE%%$'\n'*}"
            node tooling/scripts/check-git-naming.mjs --subject "$commit_subject"
          elif [[ "$NEXUS_EVENT_NAME" == 'workflow_dispatch' && "$NEXUS_BRANCH" == 'main' ]]; then
            echo "Git naming: manual run on main; no new name to validate."
          elif [[ "$NEXUS_EVENT_NAME" == 'merge_group' ]]; then
            echo "Git naming was validated on each source pull request before queueing."
          else
            node tooling/scripts/check-git-naming.mjs --branch "$NEXUS_BRANCH"
          fi
      - name: Cross-package integration tests
        run: pnpm test:integration
      - name: Import and syntax smoke
        run: node tooling/scripts/check-syntax.mjs
      - name: Secret, path and personal-data scan
        run: node tooling/scripts/scan-sensitive.mjs
      - name: Workspace TypeScript checks
        run: pnpm -r --if-present typecheck
      - name: Engineering delivery and Git hygiene report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm report:engineering-gates

  code-intelligence-cbm-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm --filter @nexus-brain/code-intelligence... install --frozen-lockfile --ignore-scripts
      - name: Install Edge package dependencies
        run: pnpm --filter @nexus-brain/edge... install --frozen-lockfile --ignore-scripts
      - name: Edge package Windows unit tests
        run: pnpm --filter @nexus-brain/edge test:unit
      - name: Download and verify pinned CBM Windows archive
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'codebase-memory-mcp-windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.11.0/codebase-memory-mcp-windows-amd64.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '6eb6beaf261b19e419766e78baf93cbc3cf1c6338cff8fb7c0234859f96d1685'
          if ($actual -ne $expected) { throw "CBM release archive checksum mismatch: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'cbm-v0.11.0'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Get-ChildItem -LiteralPath $destination -Filter 'codebase-memory-mcp.exe' -File -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Verified CBM archive did not contain codebase-memory-mcp.exe' }
          "CBM_BINARY=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prove CBM mappings against isolated Project v2 fixture
        run: pnpm --dir packages/code-intelligence test:cbm-integration
