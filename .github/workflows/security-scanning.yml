name: Security scanning

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scanning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - name: Scan source and emit SARIF
        continue-on-error: true
        run: semgrep scan --config auto --sarif --output semgrep.sarif .
      - name: Upload findings to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: Gitleaks secrets scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  osv-scanner:
    name: OSV-Scanner dependency scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
      - name: Install OSV-Scanner from the official Google module
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
      - name: Scan source and lockfiles
        continue-on-error: true
        run: osv-scanner scan source --recursive --format sarif --output-file osv.sarif .
      - name: Upload dependency findings to GitHub code scanning
        if: always() && hashFiles('osv.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  zap-baseline:
    name: ZAP baseline scan (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated read-only dashboard
        env:
          MCG_ROOT: ${{ runner.temp }}/mcg-zap-state
        run: |
          mkdir -p "$MCG_ROOT" "$RUNNER_TEMP/zap-reports"
          node apps/cli/src/mcg.mjs dashboard --port 7435 --no-open >"$RUNNER_TEMP/mcg-zap-dashboard.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/mcg-zap-dashboard.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7435/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mcg-zap-dashboard.log"
          exit 1

      - name: Run ZAP passive baseline against the local dashboard
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
        run: |
          sudo chown 1000:1000 "$RUNNER_TEMP/zap-reports"
          docker run --rm --network host \
            --volume "$RUNNER_TEMP/zap-reports:/zap/wrk/:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:7435/ \
            -m 1 \
            -r zap-baseline.html \
            -J zap-baseline.json \
            -I

      - name: Verify ZAP reports were generated
        run: |
          test -s "$RUNNER_TEMP/zap-reports/zap-baseline.html"
          test -s "$RUNNER_TEMP/zap-reports/zap-baseline.json"

      - name: Stop isolated dashboard
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mcg-zap-dashboard.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mcg-zap-dashboard.pid")" 2>/dev/null || true
          fi

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-report
          path: ${{ runner.temp }}/zap-reports/
          if-no-files-found: warn
          retention-days: 14
